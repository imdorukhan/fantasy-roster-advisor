name: Yahoo OAuth Tests
on:
  pull_request:
    paths:
      - 'api/auth/yahoo/**'
      - '.github/workflows/yahoo-oauth-tests.yml'
  push:
    branches: [feature/yahoo-oauth]
permissions:
  contents: read
jobs:
  oauth-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node --test api/auth/yahoo/oauth.test.mjs
