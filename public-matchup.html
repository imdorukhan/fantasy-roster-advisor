<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salary CAPtain · Current matchup</title><style>body{font:16px system-ui;background:#0b1020;color:#eef1ff;max-width:1050px;margin:40px auto;padding:20px}a{color:#c4b5ff}section{background:#161e34;padding:20px;border-radius:14px;margin:20px 0}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #34405b}button{padding:12px;background:#7960dc;color:white;border:0;border-radius:8px;cursor:pointer}.scroll{overflow:auto}.muted{color:#aebbd4}</style><a href="/">← Dashboard</a> · <a href="/matchup.html">ESPN box-score comparison (separate source)</a><h1>Current matchup</h1><p>Verified Yahoo API snapshots · league 85892 · team 5</p><button id="refresh">Refresh sources</button><p id="status" role="status">Loading sources…</p><main id="result"></main><script type="module">
import {playerLink} from "./player-dialog.mjs";
const el=id=>document.getElementById(id),esc=x=>String(x??'Unknown').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const table=(headers,rows)=>'<div class="scroll"><table><tr>'+headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+(c&&typeof c==='object'?playerLink(c):esc(c))+'</td>').join('')+'</tr>').join('')+'</table></div>';
async function refresh(){el('refresh').disabled=true;el('result').replaceChildren();el('status').textContent='Checking verified Yahoo snapshots…';try{
 const [match,league]=await Promise.all(['/api/auto-data?live=1&officialMatchup=1','/api/auto-data?live=1&leagueData=1'].map(async url=>{const r=await fetch(url,{cache:'no-store',credentials:'same-origin'});return {ok:r.ok,data:await r.json()}}));
 const m=match.data,d=league.data;
 let html='';
 if(match.ok&&m.mode==='YAHOO_OFFICIAL_MATCHUP'){html+='<section><h2>'+esc(m.ourTeam.name)+' vs '+esc(m.opponent.name)+'</h2><h3>'+esc(m.score.ours)+'–'+esc(m.score.opponent)+' · '+esc(m.score.ties)+' tied</h3><p>Week '+esc(m.week)+' · observed '+esc(new Date(m.observedAt).toLocaleString())+'</p>'+table(['Category','Ours','Opponent','Leader'],m.categories.map(c=>[c.category,m.ourTeam.stats[c.category],m.opponent.stats[c.category],c.leader]))+'<p class="muted">'+esc(m.warning)+'</p></section>';}else html+='<section>Verified current matchup unavailable: '+esc(m.error||'Missing source')+'. No score is assumed.</section>';
 html+='<section><h2>Our roster</h2>'+(league.ok&&Array.isArray(d.rosterPlayers)?table(['Player','Slot','NBA team','Eligibility'],d.rosterPlayers.map(p=>[p,p.slot,p.nbaTeam,(p.eligiblePositions||[]).join(', ')])):'Verified roster unavailable')+'</section>';
 html+='<section><h2>Opponent roster</h2><p>Not included in the existing Yahoo snapshot bridge. No ownership inference.</p></section>';
 html+='<section><h2>Source status</h2>'+(league.ok?table(['Section','Last observed','Status'],Object.entries(d.sectionTimestamps||{}).map(([k,v])=>[k,new Date(v).toLocaleString(),(d.staleSections||[]).includes(k)?'Stale':'Snapshot'])):'League snapshot unavailable')+'<p>Read-only. No transactions and no new Yahoo sign-in required for this bridge.</p></section>';
 el('result').innerHTML=html;el('status').textContent=match.ok?'Verified Yahoo snapshot · '+new Date(m.observedAt).toLocaleString():'Matchup unavailable · see source details';
 }catch(e){el('status').textContent=e.message+' — no unverified scores displayed.';}finally{el('refresh').disabled=false;}}
el('refresh').onclick=refresh;refresh();
</script></html>
