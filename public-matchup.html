<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salary CAPtain · Current matchup</title><style>body{font:16px system-ui;background:#0b1020;color:#eef1ff;max-width:1050px;margin:40px auto;padding:20px}a{color:#c4b5ff}section{background:#161e34;padding:20px;border-radius:14px;margin:20px 0}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #34405b}button{padding:12px;background:#7960dc;color:white;border:0;border-radius:8px;cursor:pointer}.scroll{overflow:auto}.muted{color:#aebbd4}</style><a href="/">← Dashboard</a> · <a href="/matchup.html">ESPN box-score comparison</a><h1>Current matchup</h1><p>Yahoo public observations · league 85892 · team 5</p><button id="refresh">Refresh sources</button><p id="status" role="status">Loading sources…</p><main id="result"></main><script type="module">
const el=id=>document.getElementById(id),esc=x=>String(x??'Unknown').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const table=(headers,rows)=>'<div class="scroll"><table><tr>'+headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</table></div>';
async function refresh(){el('refresh').disabled=true;el('result').replaceChildren();el('status').textContent='Checking public sources…';try{const r=await fetch('/api/public-matchup',{cache:'no-store'});if(!r.ok)throw Error('Sources unavailable');const d=await r.json();el('status').textContent='Retrieved '+new Date(d.fetchedAt).toLocaleString()+' · '+d.status;let s='';if(d.matchup){const m=d.matchup,a=d.analysis;s+='<section><h2>'+esc(m.ours.name)+' vs '+esc(m.opponent.name)+'</h2><h3>'+a.wins+'–'+a.losses+' · '+a.ties+' tied</h3><p>Remaining player games: '+esc(m.ours.games?.remaining)+' vs '+esc(m.opponent.games?.remaining)+'</p>'+table(['Category','Ours','Opponent','Position'],a.comparison.map(c=>[c.category,c.ours,c.theirs,c.status]))+'<p class="muted">'+esc(a.note)+'</p></section>';}else s+='<section>Current Yahoo matchup unavailable. No score or opponent is assumed.</section>';
for(const [key,label] of [['ours','Our roster'],['opponent','Opponent roster']])s+='<section><h2>'+label+'</h2>'+(d.rosters?.[key]?table(['Player','Slot','NBA team','Eligibility'],d.rosters[key].map(p=>[p.name,p.slot,p.nbaTeam,p.positions.join(', ')])):'Public roster unavailable')+'</section>';
s+='<section><h2>NBA schedule · '+esc(d.date)+'</h2><p>Cross-check: '+esc(d.crossCheck)+'</p>'+(d.schedule?table(['Game','Tip-off (local time)','Source'],d.schedule.map(g=>[g.name||g.teams.join(' @ '),new Date(g.date).toLocaleString(),g.source])):'Schedule unavailable')+'</section><section><h2>Source status</h2>'+table(['Source','Result','Detail'],d.sources.map(s=>[s.source,s.status,s.reason||'Retrieved '+s.fetchedAt]))+'<p>'+d.sources.map(s=>'<a href="'+esc(s.url)+'" target="_blank" rel="noopener noreferrer">'+esc(s.source)+'</a>').join(' · ')+'</p><p>'+d.limitations.map(esc).join('<br>')+'</p><p>No transactions. OAuth approval remains necessary for authenticated league access and reliable free-agent/waiver verification.</p></section>';el('result').innerHTML=s;}catch(e){el('status').textContent=e.message+' — no stale scores displayed.';}finally{el('refresh').disabled=false;}}
el('refresh').onclick=refresh;refresh();
</script></html>
